[package]
name = "crownos-disks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
fixtures = []

[dependencies]
blake3 = "1"
futures-util = { version = "0.3", default-features = false }
gptman = "3"
liblzma = { version = "0.4", features = ["parallel"] }
nix = { version = "0.31", default-features = false, features = ["ioctl"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time", "fs"] }
udisks2 = "0.4"
zbus = { version = "6", default-features = false, features = ["tokio"] }
zeroize = { version = "1", features = ["serde"] }
zstd = { version = "0.14", features = ["zstdmt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
