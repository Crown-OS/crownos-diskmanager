[workspace]
members = ["crates/disks"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[package]
name = "crownos-diskmanager"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
rustix = { version = "1", features = ["process"] }
crownos-disks = { path = "crates/disks" }
crownui = { path = "../crownui/crownui", default-features = false, features = [
  "wayland",
  "impeller",
  "static",
  "tokio",
  "accessibility",
] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }

[dev-dependencies]
crownos-disks = { path = "crates/disks", features = ["fixtures"] }
crowntest = { path = "../crownui/crowntest" }
input = { path = "../crownui/input" }
windowing = { path = "../crownui/windowing", default-features = false }
insta = "1"

[lints]
workspace = true

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
